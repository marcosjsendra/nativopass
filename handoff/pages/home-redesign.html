<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8000ff" />
    <meta name="description" content="NativoPass — Inicio Rediseño (Iteración 1 y 2)" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />

    <!-- Pure Modular Stylesheets -->
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/globals.css" />
    <link rel="stylesheet" href="../css/iterations.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/responsive.css" />

    <title>NativoPass — Inicio (Rediseño Aprobado)</title>

    <style>
      body {
        background: #0d0c12;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .standalone-wrapper {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        background: #fff;
        position: relative;
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  <body>
    <div class="standalone-wrapper">
      <div class="app-shell app-shell--iteration-1">
        <div class="app-content">
          
          <!-- Hero Redesign -->
          <section class="hero hero--lifestyle-new hero--iteration-one" aria-label="Beneficios NativoPass">
            <div class="hero-media">
              <img class="hero-slide hero-slide--active" src="../assets/images/nativo-pass-hero-slide1-new.png" alt="Miembro de NativoPass celebrando un beneficio desde su celular" />
              <div class="hero-brand hero-brand--plain">
                <img src="../assets/logos/Nativopass-logo.svg" alt="NativoPass" />
              </div>
              <h1 class="hero-title" aria-live="polite">TU ESTILO DE VIDA, <strong> PREMIADO.</strong></h1>
              
              <div class="membership-cta-region">
                <section class="membership-cta membership-cta--guest" aria-label="Invitación a unirse a NativoPass" aria-live="polite">
                  <img class="membership-cta-backdrop" src="../assets/images/nativo-pass-hero-slide1-new.png" alt="" aria-hidden="true" />
                  <strong class="membership-guest-title">DESBLOQUEÁ MIEMBROS+</strong>
                  <span class="membership-guest-copy">Jugá, sumá puntos y ganá premios cada semana.</span>
                  <a href="membership-payment.html" style="text-decoration:none; display:grid; place-items:center; color:inherit;"><button type="button">UNIRME</button></a>
                </section>
              </div>
            </div>
          </section>

          <!-- Category Grid (4 approved categories for iteration 1) -->
          <section class="category-section category-section--scroll-reveal category-section--visible" aria-label="Categorías de beneficios">
            <div class="category-grid">
              <button class="category-card" style="--category-gradient: linear-gradient(145deg, #cfd621 5%, #008845 100%); --category-index: 0" type="button" aria-pressed="false">
                <span class="category-icon"><img src="../assets/icons/category-section/turismo-icon.svg" alt="" /></span>
                <span class="category-label">TURISMO</span>
              </button>
              <button class="category-card" style="--category-gradient: linear-gradient(145deg, #ffe600 5%, #ff7300 100%); --category-index: 1" type="button" aria-pressed="false">
                <span class="category-icon"><img src="../assets/icons/category-section/gastronomia-icon.svg" alt="" /></span>
                <span class="category-label">GASTRONOMÍA</span>
              </button>
              <button class="category-card" style="--category-gradient: linear-gradient(145deg, #00d4ff 5%, #0045b2 100%); --category-index: 2" type="button" aria-pressed="false">
                <span class="category-icon"><img src="../assets/icons/category-section/bienestar-icon.svg" alt="" /></span>
                <span class="category-label">BIENESTAR</span>
              </button>
              <button class="category-card" style="--category-gradient: linear-gradient(145deg, #892785 5%, #3000a2 100%); --category-index: 3" type="button" aria-pressed="false">
                <span class="category-icon"><img src="../assets/icons/category-section/hogar-icon.svg" alt="" /></span>
                <span class="category-label">HOGAR</span>
              </button>
            </div>
          </section>

          <!-- Snake Rewards (NEÓN Redesign) -->
          <section class="snake-section snake-section--iteration-one" aria-labelledby="snake-title-iteration-one">
            <div class="snake-card--iteration-one snake-card--scroll-reveal snake-card--visible">
              <video class="snake-video--iteration-one" src="../assets/video/snake-promo-seedance-cartoon.mp4" autoplay muted loop playsinline preload="auto" aria-label="Animación neón del juego Snake de Nativo Rewards"></video>
              <div class="snake-shade--iteration-one" aria-hidden="true"></div>
              <div class="snake-reveal-scan--iteration-one" aria-hidden="true"></div>
              <header class="rewards-banner--iteration-one">
                <img class="rewards-token--iteration-one" src="../assets/images/snake-game/reward-token.png" alt="" />
                <p><span><strong>NATIVO</strong><br /> REWARDS</span></p>
              </header>
              <h2 class="sr-only" id="snake-title-iteration-one">Nativo Rewards</h2>
              <button class="snake-button--iteration-one" type="button"><span>JUGÁ AHORA</span></button>
            </div>
          </section>

        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-navigation" aria-label="Navegación principal">
          <div class="bottom-nav-slot">
            <button class="is-active" type="button" aria-label="Inicio" aria-current="page">
              <img src="../assets/icons/nav-bar/home.svg" alt="" />
            </button>
          </div>
          <div class="bottom-nav-slot">
            <span class="nav-divider" aria-hidden="true"></span>
            <button type="button" aria-label="Escanear QR">
              <img src="../assets/icons/nav-bar/qr-codes.svg" alt="" />
            </button>
          </div>
          <div class="bottom-nav-slot">
            <span class="nav-divider" aria-hidden="true"></span>
            <button type="button" aria-label="Menú">
              <img src="../assets/icons/nav-bar/menu.svg" alt="" />
            </button>
          </div>
        </nav>
      </div>
    </div>

    <!-- Vanilla Script -->
    <script src="../js/app.js"></script>
  </body>
</html>
